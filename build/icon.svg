<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>
  
  <!-- Shine effect -->
  <rect x="0" y="0" width="1024" height="512" rx="220" fill="url(#shine)"/>
  
  <!-- Database icon -->
  <g transform="translate(512, 512)">
    <!-- Outer ring -->
    <ellipse cx="0" cy="-80" rx="280" ry="100" fill="none" stroke="white" stroke-width="40"/>
    
    <!-- Middle section -->
    <path d="M-280,-80 L-280,80 C-280,135 -155,180 0,180 C155,180 280,135 280,80 L280,-80" 
          fill="none" stroke="white" stroke-width="40"/>
    
    <!-- Bottom ellipse -->
    <ellipse cx="0" cy="80" rx="280" ry="100" fill="none" stroke="white" stroke-width="40"/>
    
    <!-- Inner details -->
    <ellipse cx="0" cy="-80" rx="180" ry="65" fill="rgba(255,255,255,0.2)"/>
    <ellipse cx="0" cy="0" rx="180" ry="65" fill="rgba(255,255,255,0.15)"/>
    <ellipse cx="0" cy="80" rx="180" ry="65" fill="rgba(255,255,255,0.1)"/>
  </g>
</svg>

